<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Cascade</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="main">
      <div class="list" id="subsection">Red text on yellow background</div>
    </div>

    <br />

    <div class="class">
      <div class="class second-class">This is an example</div>
    </div>

    <br />

    <div id="parent">
      <div class="child">Child</div>
    </div>

    <br />

    <div>
      <div class="alert warning">This is Important</div>
    </div>
  </body>
</html>
